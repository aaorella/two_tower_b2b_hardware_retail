[project]
name = "tesis-two-towers-ferretero"
version = "0.1.0"
description = "Two-Towers retrieval recommender for Ecuadorian B2B hardware distribution — thesis experiments"
requires-python = ">=3.12"
dependencies = [
    "tensorflow==2.21.0",
    "tensorflow-recommenders==0.7.2",
    "faiss-cpu==1.14.2",
    "scikit-surprise==1.1.5",
    "scipy==1.17.1",
    "umap-learn==0.5.12",
    "scikit-learn==1.8.0",
    "polars==1.41.2",
    "pandas==3.0.3",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "tabulate==0.10.0",
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
    "ipykernel>=6.0",
]

# Reproducible execution of the experiment notebooks:
#   uv run jupyter nbconvert --to notebook --execute --inplace \
#     experimentos/12_extended_metrics_and_ci.ipynb
# To build the environment from scratch: `uv sync`.
